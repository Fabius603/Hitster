<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101015"><title>Hitster · Player</title><link rel="stylesheet" href="style.css"><script defer src="vendor/html5-qrcode.min.js"></script><script defer src="player.js"></script></head>
<body><main class="game" aria-label="Hitster Player">
<section class="stage" aria-label="Soundplayer">
<div class="record" id="record"><div class="record-center"><button id="play" class="play" aria-label="Sound abspielen" disabled><svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button></div></div>
<audio id="audio" preload="metadata"></audio><video id="video" controls playsinline preload="metadata" hidden></video>
<div id="scanner-panel" hidden><div id="reader"></div></div>
</section>
<section class="controls" aria-label="Wiedergabe">
<div class="timeline"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Wiedergabeposition" disabled><span id="duration">0:00</span></div>
<p id="status" role="status" aria-live="polite">Scanne deine erste Karte.</p>
<button id="scan" class="scan" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5M7 7h3v3H7zm7 0h3v3h-3zM7 14h3v3H7zm7 0h3v3h-3z"/></svg><span id="scan-label">QR-Code scannen</span></button>
</section>
</main></body></html>
