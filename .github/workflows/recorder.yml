name: Build Windows recorder
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore pinned recorder dependencies
        run: dotnet restore desktop/Hitster.Recorder --locked-mode
      - name: Build Windows app
        run: dotnet build desktop/Hitster.Recorder --configuration Release --no-restore
      - name: Build recorder tests
        run: dotnet build desktop/Hitster.Recorder.Tests --configuration Release
      - name: Publish Windows app
        run: dotnet publish desktop/Hitster.Recorder --configuration Release --no-restore --self-contained false --output desktop/publish
      - uses: actions/upload-artifact@v4
        with:
          name: Hitster-Recorder-Windows
          path: desktop/publish/
